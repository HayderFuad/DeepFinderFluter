name: deepfinder_v1
description: "DeepFinder v1 - محرك البحث الذكي الشامل في أسماء الملفات ومحتواها العميق (أوفلاين 100%)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Persistence
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Local Database & Full-Text Search (FTS5 / FTS4)
  sqflite: ^2.4.1
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.0
  path_provider: ^2.1.5

  # Pure Dart Document Parsers (PDF, DOCX, XLSX)
  syncfusion_flutter_pdf: ^33.2.13
  archive: ^3.6.1
  xml: ^6.5.0

  # File Picking, Permissions, Opening, Sharing & External Links
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # UI & Formatting
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "assets/icon/iconserch.png"
  android: true
  ios: true
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/icon/iconserch.png
